[project]
name = "ableton-mcp-extended"
version = "0.1.0"
description = "Privacy-focused Ableton Live MCP derivative with extended editing and mixing tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"},
    {name = "RichieMiller-HU"},
]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "detect-secrets>=1.5.0",
    "pytest>=8.0",
]

[project.scripts]
ableton-mcp-extended = "MCP_Server.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["MCP_Server"]

[project.urls]
Homepage = "https://github.com/RichieMiller-HU/ableton-mcp-extended"
Upstream = "https://github.com/ahujasid/ableton-mcp"
Issues = "https://github.com/RichieMiller-HU/ableton-mcp-extended/issues"
